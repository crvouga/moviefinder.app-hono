# Runtime config for Fly Machines. The deployable artifact is a pre-built OCI
# image (see CONTAINER_IMAGE_REPO in deploy/config.ts); CI builds and pushes it,
# then deploy/fly.ts promotes that tag via `fly deploy --image`.

app = "chrisvouga-moviefinder"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
