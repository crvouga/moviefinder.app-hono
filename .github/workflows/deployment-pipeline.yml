name: Deployment pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce kebab-case filenames
        run: bun run lint:filenames

      - name: Typecheck
        run: bun run tc

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vault on Fly.io can cold-start sealed; vault-action does not retry login.
      - name: Wait for Vault to be ready
        run: |
          url="https://secret-store.chrisvouga.dev/v1/sys/health?sealedcode=200&uninitcode=200&standbycode=200"
          for attempt in $(seq 1 36); do
            response=$(curl -fsS "$url" 2>/dev/null || true)
            if [ -n "$response" ] && echo "$response" | jq -e '.sealed == false' >/dev/null 2>&1; then
              echo "Vault is unsealed and ready"
              exit 0
            fi
            sealed=$(echo "$response" | jq -r '.sealed // empty' 2>/dev/null)
            if [ -z "$sealed" ]; then sealed="unreachable"; fi
            echo "Vault not ready (sealed=${sealed}, attempt ${attempt}/36), waiting 5s..."
            sleep 5
          done
          echo "Vault did not become ready within 3 minutes"
          exit 1

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://secret-store.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://secret-store.chrisvouga.dev
          secrets: |
            secret/data/personal/prd CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            secret/data/personal/prd CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            secret/data/personal/prd DATABASE_URL | DATABASE_URL ;
            secret/data/personal/prd TMDB_API_READ_ACCESS_TOKEN | TMDB_API_READ_ACCESS_TOKEN ;
            secret/data/personal/prd OPENAI_API_KEY | OPENAI_API_KEY ;
            secret/data/personal/prd OPENAI_PROJECT_ID | OPENAI_PROJECT_ID ;
            secret/data/personal/prd TWILIO_ACCOUNT_SID | TWILIO_ACCOUNT_SID ;
            secret/data/personal/prd TWILIO_AUTH_TOKEN | TWILIO_AUTH_TOKEN ;
            secret/data/personal/prd TWILIO_SERVICE_SID | TWILIO_SERVICE_SID ;
            secret/data/personal/prd BETTER_AUTH_SECRET | BETTER_AUTH_SECRET ;
            secret/data/personal/prd BETTER_AUTH_URL | BETTER_AUTH_URL

      - name: Deploy to Cloudflare Workers and configure DNS
        run: bun run deploy/deploy.ts

  summary:
    name: Summary
    needs: [check, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write deployment summary
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }

          OVERALL="$CHECK_RESULT"
          if [ "$DEPLOY_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            OVERALL="$DEPLOY_RESULT"
          elif [ "$CHECK_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            OVERALL="failure"
          fi

          case "$OVERALL" in
            success) HEADER="Deployment succeeded" ;;
            cancelled) HEADER="Deployment cancelled" ;;
            *) HEADER="Deployment failed" ;;
          esac

          SHORT_SHA="${COMMIT_SHA:0:7}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${HEADER}

          | | |
          | --- | --- |
          | **Commit** | [\`${SHORT_SHA}\`](${RUN_URL}) |

          ### Pipeline

          | Stage | Result |
          | --- | --- |
          | Check | $(status_icon "$CHECK_RESULT") ${CHECK_RESULT} |
          | Deploy | $(status_icon "$DEPLOY_RESULT") ${DEPLOY_RESULT} |

          ### Live

          | | |
          | --- | --- |
          | **Site** | https://www.moviefinder.app |
          | **Apex redirect** | https://moviefinder.app → www |
          | **Worker** | moviefinder |

          ---
          _[View workflow run](${RUN_URL})_
          EOF
