name: Deployment pipeline

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce kebab-case filenames
        run: bun run lint:filenames

      - name: Typecheck
        run: bun run tc

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: image_tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://secret-store.chrisvouga.dev
          method: jwt
          path: jwt
          role: github-actions
          jwtGithubAudience: https://secret-store.chrisvouga.dev
          secrets: |
            secret/data/personal/prd FLY_API_TOKEN | FLY_API_TOKEN ;
            secret/data/personal/prd CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            secret/data/personal/prd CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            secret/data/personal/prd TMDB_API_READ_ACCESS_TOKEN | TMDB_API_READ_ACCESS_TOKEN ;
            secret/data/personal/prd OPENAI_API_KEY | OPENAI_API_KEY ;
            secret/data/personal/prd OPENAI_PROJECT_ID | OPENAI_PROJECT_ID ;
            secret/data/personal/prd TWILIO_ACCOUNT_SID | TWILIO_ACCOUNT_SID ;
            secret/data/personal/prd TWILIO_AUTH_TOKEN | TWILIO_AUTH_TOKEN ;
            secret/data/personal/prd TWILIO_SERVICE_SID | TWILIO_SERVICE_SID ;
            secret/data/personal/prd BETTER_AUTH_SECRET | BETTER_AUTH_SECRET ;
            secret/data/personal/prd BETTER_AUTH_URL | BETTER_AUTH_URL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Fly.io and configure Cloudflare
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_REPOSITORY: ${{ github.repository }}
        run: bun run deploy/deploy.ts

  summary:
    name: Summary
    needs: [check, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write deployment summary
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "⚠️" ;;
            esac
          }

          OVERALL="$BUILD_RESULT"
          if [ "$DEPLOY_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            OVERALL="$DEPLOY_RESULT"
          elif [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            OVERALL="failure"
          fi

          case "$OVERALL" in
            success) HEADER="Deployment succeeded" ;;
            cancelled) HEADER="Deployment cancelled" ;;
            *) HEADER="Deployment failed" ;;
          esac

          IMAGE="ghcr.io/${GHCR_REPOSITORY}:${IMAGE_TAG}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${HEADER}

          | | |
          | --- | --- |
          | **Commit** | [\`${SHORT_SHA}\`](${RUN_URL}) |
          | **Container image** | \`${IMAGE}\` |
          | **Also tagged** | \`ghcr.io/${GHCR_REPOSITORY}:latest\` |

          ### Pipeline

          | Stage | Result |
          | --- | --- |
          | Build & push | $(status_icon "$BUILD_RESULT") ${BUILD_RESULT} |
          | Deploy | $(status_icon "$DEPLOY_RESULT") ${DEPLOY_RESULT} |

          ### Live

          | | |
          | --- | --- |
          | **Site** | https://www.moviefinder.app |
          | **Apex redirect** | https://moviefinder.app → www |
          | **Fly app** | [moviefinder](https://fly.io/apps/moviefinder) |
          | **Package** | [GHCR](https://github.com/${GHCR_REPOSITORY}/pkgs/container/moviefinder.app-hono) |

          ---
          _[View workflow run](${RUN_URL})_
          EOF
